{% extends 'base.html' %}

{% block titulo %}Cadastrar Cliente - Lanchonete Delícia{% endblock %}

{% block conteudo %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-950">Novo Cliente</h1>
        <p class="text-sm text-gray-500">Insira os dados do cliente para realizar o cadastro.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
            <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1">Telefone / WhatsApp</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="Ex: (11) 99999-9999"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
            <label for="pontos_fidelidade" class="block text-sm font-medium text-gray-700 mb-1">Pontos de Fidelidade Iniciais</label>
            <input type="number" id="pontos_fidelidade" name="pontos_fidelidade" min="0" value="0" required placeholder="Ex: 10"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4">
            <a href="/cliente" class="text-sm font-medium text-gray-600 hover:text-gray-800 transition">Cancelar</a>
            <button type="submit" 
                    class="bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 px-4 rounded-lg shadow transition">
                Salvar Cliente
            </button>
        </div>
    </form>
</div>
{% endblock %}
