{% extends 'base.html' %}

{% block titulo %}Cadastrar Fornecedor - Lanchonete Delícia{% endblock %}

{% block conteudo %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-950">Novo Fornecedor</h1>
        <p class="text-sm text-gray-500">Cadastre um novo parceiro ou distribuidor de insumos.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label for="nome_empresa" class="block text-sm font-medium text-gray-700 mb-1">Nome da Empresa</label>
            <input type="text" id="nome_empresa" name="nome_empresa" required placeholder="Ex: Distribuidora Central de Alimentos"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
            <label for="cnpj" class="block text-sm font-medium text-gray-700 mb-1">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" required placeholder="Ex: 00.000.000/0001-00"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
            <label for="produto_fornecido" class="block text-sm font-medium text-gray-700 mb-1">Produto Fornecido</label>
            <input type="text" id="produto_fornecido" name="produto_fornecido" required placeholder="Ex: Hambúrguer, Pães, Queijo Cheddar"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4">
            <a href="/fornecedor" class="text-sm font-medium text-gray-600 hover:text-gray-800 transition">Cancelar</a>
            <button type="submit" 
                    class="bg-gray-700 hover:bg-gray-800 text-white font-medium py-2 px-4 rounded-lg shadow transition">
                Salvar Fornecedor
            </button>
        </div>
    </form>
</div>
{% endblock %}
